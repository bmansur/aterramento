<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercicio 3</title>

  <style>
    body{
        font-family: Arial, sans-serif;
        background:#f1f3f4;
        padding:20px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    .resultado{
        background:#f1f8e9;
        font-weight:bold;
    }
  </style>
</head>

<body>

  <h2>Dados</h2>

  <label>
    Comprimento da malha de aterramento (m):
    <input type="number" id="comprimento" step="0.1">
  </label>

  <label>
    Distância entre cabos correspondente ao comprimento da malha (m):
    <input type="number" id="dc" step="0.1">
  </label>

  <label>
    Largura da malha de aterramento (m):
    <input type="number" id="largura" step="0.1">
  </label>

  <label>
    Distância entre cabos correspondente à largura da malha (m):
    <input type="number" id="dl" step="0.1">
  </label>

  <button onclick="calcular()">Calcular</button>

  <h2>Resultados</h2>

  <div class="resultados">

    <label>
      Número de condutores principais:
      <h3 id="ncp"></h3>
    </label>
    <label>
      Número de condutores de junção:
      <h3 id="ncj"></h3>
    </label>
  </div>
  <script src="./exercicio3.js"></script>
</body>
</html>
