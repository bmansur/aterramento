<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilha de Coleta</title>

  <style>
    body{
        font-family: Arial, sans-serif;
        background:#f1f3f4;
        padding:20px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    .planilha{
        display:grid;
        grid-template-columns: 50px repeat(6,120px);
        width:max-content;
        border:1px solid #ccc;
        background:white;
    }

    .celula{
        border:1px solid #e0e0e0;
        min-height:35px;
        padding:8px;
        outline:none;
        box-sizing:border-box;
    }

    .topo,
    .linha{
        background:#f8f9fa;
        font-weight:bold;
        text-align:center;
    }

    .editavel{
        background:white;
    }

    .editavel:focus{
        border:2px solid #1a73e8;
        background:#e8f0fe;
    }

    .resultado{
        background:#f1f8e9;
        font-weight:bold;
    }
  </style>
</head>

<body>
    <h2>Dados de Entrada</h2>

  <label>Comprimento (m):
    <input type="number" id="comprimento" step="0.1">
  </label>

  <label>Diâmetro (polegadas):
    <input type="number" id="diametro" step="0.1">
  </label>

  <label>Resistividade do solo:
    <input type="number" id="resistividade" step="any">
  </label>

  <label>Modelo de Aterramento:
    <select id="modelo" onChange="mudarModelo()">
      <option value="RT simples">RT – Eletrodo simples</option>
      <option value="RT paralelo">RT equivalente de hastes paralelas igualmente espaçadas</option>
      <option value="RT triangulo">RT de hastes dispostas em forma de triângulo</option>
      <option value="RT quadrado vazio">RT de hastes em quadrado vazio</option>
      <option value="RT quadrado cheio">RT de hastes em quadrado cheio</option>
      <option value="RT circunferencia">RT de hastes dispostas em circunferência</option>
      <option value="RT anel">RT de condutores enterrados horizontalmente, dispostos em forma de anel</option>
    </select>
  </label>

  <label id="fatorReducaoLabel" style="{display: 'none'}">Fator de redução (K):
    <input type="number" id="fatorReducao" step="any">
  </label>

  <button onclick="calcular()">Calcular</button>

  <h3 id="resultado"></h3>
  
  <script src="./exercicio1.js"></script>
</body>
</html>
